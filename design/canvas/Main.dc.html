<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Klair — resting, ideas ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D3128}a:hover{color:#000000}
@keyframes klair-bob{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.klair-bob{animation:klair-bob 3.2s steps(1) infinite}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: Nunito, -apple-system, 'Helvetica Neue', sans-serif; color: #2D3128">
  <div style="position: absolute; inset: 0">
    <dc-import name="Backdrop" hint-size="1440px,900px"></dc-import>
  </div>

  <div style="position: absolute; top: 12px; right: 14px; display: flex; align-items: center; gap: 12px">
    <a href="Open.dc.html" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 8px 0 16px; border-radius: 999px; text-decoration: none; background: linear-gradient(180deg, rgba(255,255,255,0.64), rgba(255,244,242,0.46)); backdrop-filter: blur(36px) saturate(170%); -webkit-backdrop-filter: blur(36px) saturate(170%); border: 1px solid rgba(255,255,255,0.75); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 0 4px rgba(255,255,255,0.14), 0 10px 30px rgba(90,60,55,0.18)">
      <span style="font-size: 14px; font-weight: 700">3 ideas for this section</span>
      <kbd style="font: 700 11.5px Nunito, -apple-system, sans-serif; line-height: 1; padding: 5px 8px; border-radius: 6px; background: #FFFFFF; border: 1px solid #E2D3D0; box-shadow: 0 2px 0 #E2D3D0; color: #2D3128">fn</kbd>
    </a>
    <div class="klair-bob" style="filter: drop-shadow(0 1px 1px rgba(90,60,55,0.28))">
      <dc-import name="Flower" res="11" cell="4" hint-size="44px,44px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
